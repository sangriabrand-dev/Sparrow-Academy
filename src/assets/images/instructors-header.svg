<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" width="1920" height="800">
  <defs>
    <linearGradient id="i-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="i-glow-main" cx="82%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.38"/>
      <stop offset="35%" stop-color="#4f46e5" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="i-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Base -->
  <rect width="1920" height="800" fill="url(#i-bg)"/>

  <!-- Radial Core Glow -->
  <rect width="1920" height="800" fill="url(#i-glow-main)"/>

  <!-- Concentric Orbital Beacon Rings on Right -->
  <g transform="translate(1550, 400)">
    <!-- Expanding Circles -->
    <circle r="360" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.12" stroke-dasharray="6,6"/>
    <circle r="270" fill="none" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.18"/>
    <circle r="190" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="8,5"/>
    <circle r="120" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.35"/>
    <circle r="60" fill="rgba(99, 102, 241, 0.12)" stroke="#818cf8" stroke-width="2" stroke-opacity="0.6"/>

    <!-- Luminous Center Node -->
    <circle r="20" fill="url(#i-core)"/>
    <circle r="6" fill="#ffffff"/>

    <!-- Orbiting Constellation Points -->
    <g transform="rotate(35)">
      <circle cx="120" cy="0" r="4.5" fill="#38bdf8"/>
      <line x1="0" y1="0" x2="120" y2="0" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    </g>
    <g transform="rotate(130)">
      <circle cx="190" cy="0" r="5" fill="#a78bfa"/>
      <line x1="0" y1="0" x2="190" y2="0" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.35"/>
    </g>
    <g transform="rotate(225)">
      <circle cx="270" cy="0" r="4" fill="#818cf8"/>
      <line x1="0" y1="0" x2="270" y2="0" stroke="#818cf8" stroke-width="1" stroke-opacity="0.25"/>
    </g>
    <g transform="rotate(310)">
      <circle cx="190" cy="0" r="3.5" fill="#ffffff"/>
    </g>
  </g>

  <!-- Gentle Harmonic Waves sweeping past center base -->
  <path d="M0 720 Q600 680 1200 740 T1920 680" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.2"/>
  <path d="M0 750 Q700 710 1350 760 T1920 720" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Calm Dark Center Shield -->
  <rect width="1920" height="800" fill="#090d16" opacity="0.22"/>
</svg>