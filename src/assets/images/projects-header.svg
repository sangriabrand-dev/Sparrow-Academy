<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" width="1920" height="800">
  <defs>
    <linearGradient id="p-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="p-grad-line" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="p-orb" cx="85%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.4"/>
      <stop offset="45%" stop-color="#7c3aed" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <pattern id="p-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Deep Base -->
  <rect width="1920" height="800" fill="url(#p-bg)"/>

  <!-- Perspective Ambient Grid -->
  <rect x="800" y="0" width="1120" height="800" fill="url(#p-grid)"/>

  <!-- Radial Glow Behind Structures -->
  <rect width="1920" height="800" fill="url(#p-orb)"/>

  <!-- Isometric / Geometric Project Structures on Right Side -->
  <g transform="translate(1380, 260)" stroke="#818cf8" stroke-width="1.5" fill="none" opacity="0.6">
    <!-- Isometric Cube 1 -->
    <polygon points="0,-80 70,-40 0,0 -70,-40" fill="rgba(99, 102, 241, 0.15)" stroke="#a78bfa" stroke-opacity="0.7"/>
    <polygon points="-70,-40 0,0 0,80 -70,40" fill="rgba(79, 70, 229, 0.25)" stroke="#6366f1" stroke-opacity="0.8"/>
    <polygon points="0,0 70,-40 70,40 0,80" fill="rgba(124, 58, 237, 0.2)" stroke="#818cf8" stroke-opacity="0.8"/>

    <!-- Connected Node Rods -->
    <line x1="70" y1="0" x2="180" y2="60" stroke="#38bdf8" stroke-opacity="0.5" stroke-dasharray="4,4"/>
    <line x1="0" y1="-80" x2="120" y2="-160" stroke="#a78bfa" stroke-opacity="0.4"/>
    
    <!-- Accent Dots -->
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
    <circle cx="70" cy="-40" r="3" fill="#38bdf8"/>
    <circle cx="-70" cy="-40" r="3" fill="#818cf8"/>
  </g>

  <!-- Secondary Secondary Prism -->
  <g transform="translate(1650, 420)" stroke="#6366f1" stroke-width="1.2" fill="none" opacity="0.5">
    <polygon points="0,-60 52,-30 0,0 -52,-30" fill="rgba(99, 102, 241, 0.1)"/>
    <polygon points="-52,-30 0,0 0,60 -52,30" fill="rgba(79, 70, 229, 0.18)"/>
    <polygon points="0,0 52,-30 52,30 0,60" fill="rgba(139, 92, 246, 0.15)"/>
    <circle cx="0" cy="0" r="3" fill="#a78bfa"/>
  </g>

  <!-- Floating Vector Nodes -->
  <g stroke="url(#p-grad-line)" stroke-width="1">
    <line x1="1200" y1="620" x2="1480" y2="480"/>
    <line x1="1480" y1="480" x2="1750" y2="620"/>
    <line x1="1100" y1="200" x2="1320" y2="140"/>
    <line x1="1320" y1="140" x2="1520" y2="210"/>
  </g>
  <circle cx="1200" cy="620" r="4" fill="#38bdf8" opacity="0.7"/>
  <circle cx="1480" cy="480" r="4" fill="#818cf8" opacity="0.7"/>
  <circle cx="1750" cy="620" r="4" fill="#a78bfa" opacity="0.7"/>
  <circle cx="1320" cy="140" r="3.5" fill="#6366f1" opacity="0.8"/>

  <!-- Calm Dark Center Shield for Text -->
  <rect width="1920" height="800" fill="#090d16" opacity="0.2"/>
</svg>