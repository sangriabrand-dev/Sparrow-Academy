<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" width="1920" height="800">
  <defs>
    <linearGradient id="c-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="45%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="c-wave1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="c-wave2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="c-glow-r" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#4f46e5" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c-glow-l" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <pattern id="c-dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#818cf8" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Deep Base -->
  <rect width="1920" height="800" fill="url(#c-bg)"/>

  <!-- Subtle Matrix in background -->
  <rect x="900" y="0" width="1020" height="600" fill="url(#c-dots)" opacity="0.65"/>

  <!-- Radial Glows -->
  <rect width="1920" height="800" fill="url(#c-glow-r)"/>
  <rect width="1920" height="800" fill="url(#c-glow-l)"/>

  <!-- Flowing Dynamic Waves -->
  <path d="M700 800 C950 620, 1100 680, 1350 480 C1600 280, 1750 320, 1920 180 L1920 800 Z" fill="url(#c-wave1)"/>
  <path d="M900 800 C1100 580, 1320 620, 1550 420 C1720 280, 1850 240, 1920 120 L1920 800 Z" fill="url(#c-wave2)"/>
  
  <!-- Sweeping Crest Lines -->
  <path d="M600 800 Q1150 450 1920 160" fill="none" stroke="#818cf8" stroke-width="2" stroke-opacity="0.35"/>
  <path d="M750 800 Q1280 480 1920 230" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.4"/>
  <path d="M950 800 Q1420 520 1920 310" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Glowing Accent Orbs on Right -->
  <circle cx="1620" cy="240" r="140" fill="#6366f1" opacity="0.18" filter="blur(30px)"/>
  <circle cx="1780" cy="180" r="80" fill="#a78bfa" opacity="0.22" filter="blur(20px)"/>
  <circle cx="1540" cy="360" r="6" fill="#38bdf8" opacity="0.6"/>
  <circle cx="1680" cy="220" r="4" fill="#ffffff" opacity="0.8"/>
  <circle cx="1420" cy="460" r="5" fill="#818cf8" opacity="0.7"/>

  <!-- Soft vignette over center to preserve text contrast -->
  <rect width="1920" height="800" fill="#090d16" opacity="0.25"/>
</svg>